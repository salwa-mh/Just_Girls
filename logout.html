<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logout Page</title>

</head>
<body>

    <div class="icon">

    <button class="btn btn-primary" onclick="stay()">Naah, just kidding</button>

  </div>

 
  <script src="javascript/logout.js"></script>
</body>
</html>
